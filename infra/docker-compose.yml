services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sales_intel
      POSTGRES_PASSWORD: sales_intel
      POSTGRES_DB: sales_intel
    ports:
      # Host port 5433, not 5432: avoids colliding with a locally-installed Postgres service
      # (common on dev machines) that may already be bound to 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_intel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
